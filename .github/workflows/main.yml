name: Firmware
run-name: Build Firmware Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read
  checks: read
  deployments: read
  issues: read
  discussions: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client/embedded

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for version tagging
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
          
      - name: Get git commit hash
        id: git_hash
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Git hash: $HASH"
      
      - name: Update version files
        run: |
          python ../../scripts/update-version.py ${{ steps.version.outputs.version }} ${{ steps.git_hash.outputs.hash }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: npm ci
        working-directory: client/web

      - name: Build Web App
        run: npm run build
        working-directory: client/web
          
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio gcovr

      - name: Run Host Unit Tests
        run: pio test -e native

      - name: Generate Function Coverage Report
        run: |
          gcovr \
            --root . \
            --object-directory .pio/build/native \
            --filter src \
            --filter lib \
            --exclude 'test/.*' \
            --txt coverage-functions.txt \
            --txt-metric function \
            --json-summary coverage-summary.json

      - name: Publish Coverage Summary
        run: |
          python - <<'PY'
          import json
          import os

          with open("coverage-summary.json", "r", encoding="utf-8") as f:
              summary = json.load(f)

          covered = int(summary.get("function_covered", 0))
          total = int(summary.get("function_total", 0))
          percent = float(summary.get("function_percent", 0.0))

          line = f"Function coverage (src + lib): {covered}/{total} ({percent:.2f}%)"
          print(line)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as out:
                  out.write("## Embedded Test Coverage\n\n")
                  out.write(line + "\n")
          PY

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: embedded-function-coverage
          path: |
            client/embedded/coverage-functions.txt
            client/embedded/coverage-summary.json

      - name: Build Firmware
        run: pio run -t mergebin -e wemos_d1_mini32

      - name: Build Filesystem
        run: pio run -t buildfs -e wemos_d1_mini32

      - name: Package GFPKG
        run: pio run -t package -e wemos_d1_mini32

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/embedded/.pio/build/wemos_d1_mini32/system.gfpkg

      #- name: Upload Firmware
       # uses: actions/upload-artifact@v4
        #with:
         # path: .pio/build/wemos_d1_mini32/firmware.bin
          #name: firmware
